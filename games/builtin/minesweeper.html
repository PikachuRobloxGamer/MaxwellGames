<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>Maxwell Mines</title><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0b0e18;color:#e8e9ee;font-family:system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;max-height:100vh}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.ttl{font-weight:800;font-size:1.05rem}
#score{font-weight:800;color:#3ee08f;min-width:60px}
button{background:#6c5ce7;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:.9rem}
button:hover{filter:brightness(1.12)}
canvas{background:#111627;border-radius:12px;max-width:94vw;max-height:76vh;touch-action:none}
.hint{color:#8b8fa3;font-size:.78rem;text-align:center;max-width:420px}
#stage{display:flex;flex-direction:column;align-items:center;gap:8px}
</style></head><body><div class=wrap><div class=bar><span class=ttl>💣 Maxwell Mines</span><span id=score>Score: 0</span><button id=restart>↻ Restart</button></div><div id=stage><p class=hint>Reveal safe tiles. Click 🚩 to flag. Avoid mines!</p></div></div><script>
document.getElementById('restart').onclick=function(){location.reload();};
function cv(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;document.getElementById('stage').insertBefore(c,document.getElementById('stage').firstChild);return c;}
function sc(v){document.getElementById('score').textContent=(typeof v==='string'?v:'Score: '+v);}
function onkey(fn){document.addEventListener('keydown',function(e){fn(e);});}
var AC;function tone(f,d,ty,vol){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||0.06,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}}

var N=10,M=15;
var fb=document.createElement('button');fb.textContent='🚩 Flag: OFF';var flag=false;fb.onclick=function(){flag=!flag;fb.textContent='🚩 Flag: '+(flag?'ON':'OFF');};document.getElementById('stage').insertBefore(fb,document.getElementById('stage').firstChild);
var grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat('+N+',30px);gap:3px';document.getElementById('stage').insertBefore(grid,document.getElementById('stage').firstChild);
var cells=[],mines={},revealed=0,over=false,placed=false;var CN={1:'#6ab7ff',2:'#3ee08f',3:'#ff7a7a',4:'#b77bff',5:'#ffb14a',6:'#00cec9'};
for(var i=0;i<N*N;i++){(function(i){var b=document.createElement('button');b.style.cssText='width:30px;height:30px;padding:0;background:#2a3450;border-radius:4px;font-weight:800;font-size:.8rem';b.onclick=function(){clk(i,b);};cells.push(b);grid.appendChild(b);})(i);}
function nb(i){var r=(i/N)|0,cc=i%N,o=[];for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;var nr=r+dr,nc=cc+dc;if(nr>=0&&nr<N&&nc>=0&&nc<N)o.push(nr*N+nc);}return o;}
function cnt(i){return nb(i).filter(function(n){return mines[n];}).length;}
function rev(i){var b=cells[i];if(b.dataset.open)return;b.dataset.open='1';b.style.background='#141a2c';revealed++;var n=cnt(i);if(n>0){b.textContent=n;b.style.color=CN[n]||'#fff';}else nb(i).forEach(function(k){if(!cells[k].dataset.open&&!mines[k])rev(k);});}
function clk(i,b){if(over)return;if(flag){if(!b.dataset.open){b.textContent=b.textContent?'':'🚩';}return;}if(b.textContent==='🚩'||b.dataset.open)return;
if(!placed){var cnt2=0;while(cnt2<M){var p=(Math.random()*N*N)|0;if(p!==i&&!mines[p]){mines[p]=1;cnt2++;}}placed=true;}
if(mines[i]){b.textContent='💣';b.style.background='#e8303a';over=true;sc('Boom! 💥');for(var k in mines)if(!cells[k].dataset.open)cells[k].textContent='💣';return;}
rev(i,b);sc('Safe: '+revealed+'/'+(N*N-M));tone(500,0.04);if(revealed===N*N-M){over=true;sc('Swept! 🎉');}}
sc('Safe: 0/'+(N*N-M));
</script></body></html>
