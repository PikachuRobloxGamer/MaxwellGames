<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuminSDK</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #0f1117; color: #e8e9ee;
      font-family: system-ui, sans-serif; }
    #games { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="games"></div>

  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
  <script>
    Lumin.init({
      container: '#games',
      theme: 'dark'
    });
  </script>
</body>
</html>
