<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1117; color: #e8e9ee;
    font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  .wrap { text-align: center; }
  canvas { background: #1a1d27; border-radius: 10px; max-width: 95vw; max-height: 80vh; }
  .score { margin: 8px 0; font-size: 1.1rem; }
  .hint { color: #8b8fa3; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="score">Score: <span id="score">0</span> &nbsp; Best: <span id="best">0</span></div>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="hint">Arrow keys / WASD to move · Space to restart</div>
</div>
<script>
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  const size = 20, tiles = c.width / size;
  let snake, dir, nextDir, food, score, over, best = 0;

  function reset() {
    snake = [{ x: 10, y: 10 }]; dir = { x: 1, y: 0 }; nextDir = dir;
    score = 0; over = false; placeFood(); update();
  }
  function placeFood() {
    do { food = { x: Math.floor(Math.random() * tiles), y: Math.floor(Math.random() * tiles) }; }
    while (snake.some(s => s.x === food.x && s.y === food.y));
  }
  function update() {
    document.getElementById("score").textContent = score;
    document.getElementById("best").textContent = best;
  }
  function step() {
    if (over) return draw();
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= tiles || head.y >= tiles ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      over = true; best = Math.max(best, score); update(); return draw();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score++; update(); placeFood(); }
    else snake.pop();
    draw();
  }
  function draw() {
    ctx.fillStyle = "#1a1d27"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = "#ff6b6b"; ctx.fillRect(food.x * size + 2, food.y * size + 2, size - 4, size - 4);
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#00cec9" : "#6c5ce7";
      ctx.fillRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2);
    });
    if (over) {
      ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = "#fff"; ctx.font = "bold 28px system-ui"; ctx.textAlign = "center";
      ctx.fillText("Game Over", c.width / 2, c.height / 2 - 10);
      ctx.font = "16px system-ui"; ctx.fillText("Press Space to restart", c.width / 2, c.height / 2 + 20);
    }
  }
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    const map = { arrowup: [0,-1], w: [0,-1], arrowdown: [0,1], s: [0,1],
                  arrowleft: [-1,0], a: [-1,0], arrowright: [1,0], d: [1,0] };
    if (map[k]) {
      e.preventDefault();
      const [x, y] = map[k];
      if (x !== -dir.x || y !== -dir.y) nextDir = { x, y };
    }
    if (k === " ") { e.preventDefault(); if (over) reset(); }
  });
  reset();
  setInterval(step, 110);
</script>
</body>
</html>
