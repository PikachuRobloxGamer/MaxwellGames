<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaxwellGames</title>
  <link rel="icon" type="image/png" href="maxwell.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background video -->
  <div class="bg-video" aria-hidden="true">
    <div id="bgPlayer"></div>
  </div>
  <div class="bg-tint" aria-hidden="true"></div>

  <header class="topbar">
    <a href="#" class="logo" id="homeLink"><img src="maxwell.png" alt="Maxwell the cat" class="logo-img">MaxwellGames</a>
    <input type="search" id="search" placeholder="Search games..." autocomplete="off">
  </header>

  <!-- Library view -->
  <main id="libraryView">
    <nav id="categories" class="categories"></nav>
    <p id="status" class="status">Loading games...</p>
    <section id="grid" class="grid"></section>
  </main>

  <!-- Player view -->
  <main id="playerView" class="hidden">
    <div class="player-bar">
      <button id="backBtn" class="btn">← Back</button>
      <h2 id="playerTitle"></h2>
      <div class="player-actions">
        <button id="reloadBtn" class="btn">⟳ Reload</button>
        <button id="fullscreenBtn" class="btn">⛶ Fullscreen</button>
      </div>
    </div>
    <div class="frame-wrap" id="frameWrap">
      <iframe id="gameFrame" title="Game" allow="fullscreen; autoplay; gamepad; pointer-lock" allowfullscreen></iframe>
    </div>
    <p id="playerDesc" class="player-desc"></p>
    <p class="player-credit"><a id="playerCredit" target="_blank" rel="noopener noreferrer"></a></p>
  </main>

  <footer class="footer">MaxwellGames</footer>

  <script src="script.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
