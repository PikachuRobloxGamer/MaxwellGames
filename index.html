<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaxwellGames</title>
  <link rel="icon" type="image/png" href="maxwell.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background -->
  <div class="bg-tint" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <header class="topbar">
    <a href="#" class="logo" id="homeLink"><img src="maxwell.png" alt="Maxwell the cat" class="logo-img">MaxwellGames</a>
    <nav class="tabs">
      <button class="tab active" data-tab="games">Games</button>
      <button class="tab" data-tab="proxies">Proxies</button>
      <button class="tab" data-tab="sounds">Soundboard</button>
    </nav>
    <input type="search" id="search" placeholder="Search games..." autocomplete="off">
    <button id="profileBtn" class="profile-btn" title="Your treats, level, shop &amp; achievements">
      <span class="pb-treats">🐟 <b id="treatCount">0</b></span>
      <span class="pb-level">Lv <b id="levelNum">1</b></span>
      <span class="pb-bar"><span id="xpFill"></span></span>
    </button>
  </header>

  <!-- Library view -->
  <main id="libraryView">
    <nav id="categories" class="categories"></nav>
    <p id="status" class="status">Loading...</p>
    <section id="grid" class="grid"></section>
  </main>

  <!-- Soundboard view -->
  <main id="soundView" class="hidden">
    <nav id="soundCats" class="categories"></nav>
    <p id="soundStatus" class="status">Loading sounds...</p>
    <section id="soundGrid" class="sound-grid"></section>
    <p class="sound-credit">Sounds powered by <a href="https://www.myinstants.com" target="_blank" rel="noopener noreferrer">Myinstants.com</a></p>
  </main>

  <!-- Player view -->
  <main id="playerView" class="hidden">
    <div class="player-bar">
      <button id="backBtn" class="btn">← Back</button>
      <h2 id="playerTitle"></h2>
      <div class="player-actions">
        <button id="reloadBtn" class="btn">⟳ Reload</button>
        <button id="fullscreenBtn" class="btn">⛶ Fullscreen</button>
      </div>
    </div>
    <div class="frame-wrap" id="frameWrap">
      <iframe id="gameFrame" title="Game" allow="fullscreen; autoplay; gamepad; pointer-lock" allowfullscreen></iframe>
    </div>
    <p id="playerDesc" class="player-desc"></p>
  </main>

  <footer class="footer">
    <div class="credits">
      <img src="maxwell.png" alt="Maxwell the cat" class="credits-maxwell">
      <h2 class="credits-title">MAXWELLGAMES</h2>
      <p class="credits-by">MADE BY ZAIDEN H.</p>
    </div>
  </footer>

  <!-- Profile / Shop / Achievements panel -->
  <div id="panel" class="panel hidden" role="dialog" aria-label="Profile">
    <div class="panel-box">
      <div class="panel-head">
        <img src="maxwell.png" alt="" class="panel-maxwell">
        <div>
          <h2>Your Maxwell Profile</h2>
          <p class="panel-sub">Lv <b id="pLevel">1</b> · <b id="pTreats">0</b> 🐟 treats · <span id="pXp"></span></p>
        </div>
        <button id="panelClose" class="btn panel-x" aria-label="Close">✕</button>
      </div>
      <nav class="panel-tabs">
        <button class="ptab active" data-p="shop">🛒 Shop</button>
        <button class="ptab" data-p="ach">🏆 Achievements</button>
        <button class="ptab" data-p="stats">📊 Stats</button>
        <button class="ptab" data-p="help">❓ How to earn</button>
      </nav>
      <div id="panelBody" class="panel-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="script.js"></script>
  <script src="features.js"></script>
</body>
</html>
